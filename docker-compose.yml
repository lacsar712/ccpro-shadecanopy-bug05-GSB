services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: shadecanopy
      POSTGRES_USER: shadecanopy
      POSTGRES_PASSWORD: shadecanopy
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadecanopy -d shadecanopy"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: shade-canopy-dev-secret-key-change-me
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: shadecanopy
      POSTGRES_USER: shadecanopy
      POSTGRES_PASSWORD: shadecanopy
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost:3500,http://127.0.0.1:3500"
    ports:
      - "8500:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "3500:80"
    depends_on:
      - backend

volumes:
  pgdata:
